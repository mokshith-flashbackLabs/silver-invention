[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imageshield-services"
version = "0.1.0"
description = "ImageShield services: liveness, enrolment, Rekognition collection, search provider integration. Sits behind the proxy; no public ingress."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Flashback Labs" }]
# Mirrors the Flashback agent service scaffold (AgentMeeMaw/pyproject.toml)
# minus its LLM/ML stack: no openai/anthropic/voyageai/numpy/hdbscan/scipy/
# pgvector/redis. None are needed here (CLAUDE.md §2, §10).
#
# Pillow IS here, and it is the one exception to that list. Attribution has to
# search for a SPECIFIC face in a photo, and SearchFacesByImage "first detects
# the largest face in the image" -- so three calls on a three-face photo search
# the same face three times. Isolating face N means cropping to its bounding
# box, and there is no stdlib JPEG codec. Used for exactly that, in exactly one
# module (attribution/crop.py); it is not a general image-processing dependency
# and nothing else may reach for it.
# pydantic-settings is an addition over Flashback: the build spec requires
# settings-class env validation rather than hand-rolled _required() lookups.
dependencies = [
    "psycopg[binary,pool]>=3.2.3,<4.0",
    "boto3>=1.35.49,<2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2,<3.0",
    "pydantic-settings>=2.5.0,<3.0",
    "structlog>=24.4.0",
    "httpx>=0.27.2",
    # attribution/crop.py ONLY -- see the note above.
    "pillow>=11.0.0,<12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3,<9.0",
    "pytest-postgresql>=6.1.1",
    # 1.4.0 is the first release with the `pytest_asyncio_loop_factories`
    # hook (tests/conftest.py's Windows selector-event-loop workaround);
    # anything older fails collection with an unrecognised-hook error.
    "pytest-asyncio>=1.4.0",
    "mypy>=1.13",
    "ruff>=0.7",
    # devtools/harness only: file-upload form parsing for the local test UI.
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["imageshield*"]

[tool.setuptools.package-data]
imageshield = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:botocore.*",
]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["imageshield"]

[[tool.mypy.overrides]]
# boto3/botocore ship no bundled type stubs and this repo doesn't depend on
# boto3-stubs/mypy-boto3 (the two importers — relay.py and
# liveness/provider.py — wrap the calls they need behind hand-written
# Protocols instead).
module = ["boto3", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["tests/fixtures_typecheck"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "TID"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom requires calls in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Direct SQS access from application code defeats the transactional outbox
# pattern (CLAUDE.md §2, imageshield/outbox.py): a domain write and its
# enqueue must land in one Postgres transaction, not a Postgres write plus a
# same-process SendMessage. Route all producers through
# `imageshield.outbox.enqueue` / `enqueue_sync` instead.
"boto3" = { msg = "Direct SQS access bypasses the transactional outbox — use imageshield.outbox.enqueue() instead. Only the relay (src/imageshield/relay.py), the search:runs worker (src/imageshield/search/worker.py, SQS receive only), and the Rekognition liveness provider (src/imageshield/liveness/provider.py) may import boto3 — and NEVER for an S3 client (CLAUDE.md §3.3)." }

[tool.ruff.lint.per-file-ignores]
# The four sanctioned boto3 importers:
# - the relay (Task 4): the producer→SQS side of the outbox pattern, the
#   only place that calls SendMessage;
# - the search:runs worker (step 5): SQS ReceiveMessage/DeleteMessage only —
#   the consumer counterpart of the relay;
# - the liveness provider (step 3): Rekognition Face Liveness only;
# - the face index (step 4): Rekognition collection ops (IndexFaces /
#   DeleteFaces / ListFaces) only. No S3 client anywhere — presigned URLs via
#   httpx are the only S3 path.
"src/imageshield/relay.py" = ["TID251"]
"src/imageshield/search/worker.py" = ["TID251"]
"src/imageshield/liveness/provider.py" = ["TID251"]
"src/imageshield/enrolment/faceindex.py" = ["TID251"]
"src/imageshield/attribution/rekognition.py" = ["TID251"]
"src/imageshield/aws_identity.py" = ["TID251"]
"src/imageshield/recheck/worker.py" = ["TID251"]
# Spike/eval harnesses (CLAUDE.md §8: devtools/ is outside the numbered
# steps). Not application code; the outbox rule protects request handlers,
# not one-off credential/region checks.
"devtools/*" = ["TID251"]
