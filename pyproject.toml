[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imageshield-services"
version = "0.1.0"
description = "ImageShield services: liveness, enrolment, Rekognition collection, search provider integration. Sits behind the proxy; no public ingress."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Flashback Labs" }]
# Mirrors the Flashback agent service scaffold (AgentMeeMaw/pyproject.toml)
# minus its LLM/ML stack: no openai/anthropic/voyageai/numpy/hdbscan/Pillow/
# scipy/pgvector/redis. None are needed here (CLAUDE.md §2, §10).
# pydantic-settings is an addition over Flashback: the build spec requires
# settings-class env validation rather than hand-rolled _required() lookups.
dependencies = [
    "psycopg[binary,pool]>=3.2.3,<4.0",
    "boto3>=1.35.49,<2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2,<3.0",
    "pydantic-settings>=2.5.0,<3.0",
    "structlog>=24.4.0",
    "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3,<9.0",
    "pytest-postgresql>=6.1.1",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.13",
    "ruff>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["imageshield*"]

[tool.setuptools.package-data]
imageshield = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:botocore.*",
]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["imageshield"]

[[tool.mypy.overrides]]
# boto3 ships no bundled type stubs and this repo doesn't depend on
# boto3-stubs/mypy-boto3 (relay.py, the sole importer, wraps every call it
# needs behind the hand-written `SqsClient` Protocol instead).
module = "boto3"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["tests/fixtures_typecheck"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "TID"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom requires calls in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Direct SQS access from application code defeats the transactional outbox
# pattern (CLAUDE.md §2, imageshield/outbox.py): a domain write and its
# enqueue must land in one Postgres transaction, not a Postgres write plus a
# same-process SendMessage. Route all producers through
# `imageshield.outbox.enqueue` / `enqueue_sync` instead.
"boto3" = { msg = "Direct SQS access bypasses the transactional outbox — use imageshield.outbox.enqueue() instead. Only the relay (src/imageshield/relay.py, Task 4) is allowed to import boto3." }

[tool.ruff.lint.per-file-ignores]
# The relay (Task 4, not yet created) is the one place allowed to publish to
# SQS directly — it's the consumer side of the outbox pattern, reading
# unpublished rows and calling SendMessage itself.
"src/imageshield/relay.py" = ["TID251"]
