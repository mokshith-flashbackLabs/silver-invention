name: CI

# Blocking checks on every push and PR: lint, strict typecheck, then the test
# suite (including the schema lint's DB-backed check — INVARIANTS.md #9 — run
# against a real Postgres, not mocked). No LocalStack here: SQS-touching tests
# use an injected stub client (Task 4), so this workflow only needs Postgres.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      REQUIRE_DB: "1"
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (with dev extras)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Typecheck (mypy strict)
        run: mypy

      - name: Test (pytest)
        run: pytest tests/ -v
